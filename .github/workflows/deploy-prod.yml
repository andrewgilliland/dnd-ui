name: Deploy Prod

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Fetch SSM config
        run: |
          echo "VITE_COGNITO_USER_POOL_ID=$(aws ssm get-parameter --name '/dnd-ui/prod/cognito-user-pool-id' --query 'Parameter.Value' --output text)" >> $GITHUB_ENV
          echo "VITE_COGNITO_CLIENT_ID=$(aws ssm get-parameter --name '/dnd-ui/prod/cognito-client-id' --query 'Parameter.Value' --output text)" >> $GITHUB_ENV
          echo "VITE_COGNITO_REGION=$(aws ssm get-parameter --name '/dnd-ui/prod/cognito-region' --query 'Parameter.Value' --output text)" >> $GITHUB_ENV
          echo "VITE_API_BASE_URL=$(aws ssm get-parameter --name '/dnd-ui/prod/api-base-url' --query 'Parameter.Value' --output text)" >> $GITHUB_ENV

      - name: Build
        run: npm run build

      - name: Deploy to S3
        run: |
          BUCKET=$(aws ssm get-parameter --name '/dnd-ui/prod/bucket-name' --query 'Parameter.Value' --output text)
          aws s3 sync dist/ s3://$BUCKET --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws ssm get-parameter --name '/dnd-ui/prod/distribution-id' --query 'Parameter.Value' --output text)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
